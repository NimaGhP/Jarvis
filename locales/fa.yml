connections_help_msg:
  "این ماژول اجازه می‌دهد به دیتابیس یک چت وصل شوی و بدون اینکه گروه متوجه شود،
  مواردی را به آن اضافه کنی! واضح است که برای اضافه‌کردن موارد باید ادمین باشی؛
  اما هر عضو می‌تواند داده‌هایش را ببیند (کاربران بن/کیک‌شده نمی‌توانند!).


  *دستورات*:

  × /connect `<chatid>`: به چت مشخص‌شده وصل می‌شود و امکان مشاهده/ویرایش محتوا را می‌دهد.

  × /disconnect: اتصال را از چت فعلی قطع می‌کند.

  × /reconnect: به چت متصل قبلی دوباره وصل می‌شود.

  × /connection: اطلاعات چتی که الان به آن وصل هستی را نشان می‌دهد.


  *دستورات ادمین:*

  × /allowconnect <yes/no>: مشخص می‌کند کاربران بتوانند به چت وصل شوند یا نه.


  می‌توانی شناسه چت را با دستور /id در چت بگیری. اگر شناسه منفی بود تعجب نکن؛
  همه سوپرگروه‌ها شناسه منفی دارند."
