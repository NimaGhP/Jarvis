captcha_help_msg:
  "با تایید کپچا، گروهت را از ربات‌ها و اسپمرها محافظت کن!


  اعضای جدید باید قبل از ارسال پیام با حل یک چالش ساده ثابت کنند انسان هستند.


  *انواع کپچا:*

  × Math: حل مسائل ساده ریاضی

  × Text: تشخیص متن داخل تصویر


  *دستورات ادمین:*

  × /captcha `<on/off>`: فعال یا غیرفعال کردن تایید کپچا

  × /captchamode `<math/text>`: تنظیم نوع کپچا (ریاضی یا تشخیص متن)

  × /captchatime `<1-10>`: تنظیم زمان انتظار بر حسب دقیقه (پیش‌فرض: 2)

  × /captchaaction `<kick/ban/mute>`: تنظیم اقدام در صورت شکست تایید (پیش‌فرض:
  کیک)

  × /captchaattempts `<1-10>`: تنظیم حداکثر تعداد تلاش تایید (پیش‌فرض: 3)


  وقتی فعال باشد، اعضای جدید تا تکمیل کپچا به‌صورت خودکار بی‌صدا می‌شوند.

  اگر شکست بخورند یا زمانشان تمام شود، اقدام تنظیم‌شده اعمال می‌شود."
