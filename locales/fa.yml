disabling_help_msg:
  "این ماژول بهت اجازه می‌دهد بعضی دستورهای پرکاربرد را غیرفعال کنی
  تا کسی نتواند از آن‌ها استفاده کند. همچنین می‌تواند آن‌ها را خودکار حذف کند تا
  پیام‌های دستور آبی در چت کمتر شود.


  *دستورات ادمین:*

  × /disable `<commandname>`: استفاده از یک دستور را برای کاربران در این گروه غیرفعال می‌کند.

  × /enable `<item name>`: استفاده از دستور غیرفعال‌شده را دوباره فعال می‌کند.

  × /disableable: لیست همه دستورهای قابل‌غیرفعال‌سازی را نشان می‌دهد.

  × /disabledel `<yes/no/on/off>`: دستورهای غیرفعال را هنگام استفاده توسط غیرادمین حذف می‌کند.

  × /disabled: لیست دستورهای غیرفعال این چت را نشان می‌دهد.


  نکته:

  وقتی یک دستور غیرفعال می‌شود، فقط برای غیرادمین‌ها غیرفعال است.
  همه ادمین‌ها همچنان می‌توانند از آن دستور استفاده کنند.

  دستورهای غیرفعال همچنان از طریق قابلیت /connect قابل‌دسترس هستند.
  اگر می‌خواهی این مورد هم محدود شود، در چت پشتیبانی اطلاع بده."
filters_help_msg:
  "فیلترها به حروف بزرگ/کوچک حساس نیستند؛ هر بار کسی کلمات محرک را بگوید
  Jarvis پاسخ تنظیم‌شده را می‌فرستد! می‌توانی از این قابلیت برای ساخت دستورهای سفارشی استفاده کنی.


  دستورات:

  - /filter <trigger> <reply>: هر بار کسی trigger را بگوید، ربات پاسخ می‌دهد.
  برای trigger چندکلمه‌ای، آن را داخل کوتیشن بگذار.

  - /filters: لیست همه فیلترهای چت.

  - /stop <trigger>: پاسخ‌دادن ربات به trigger را متوقف می‌کند.

  - /stopall: همه فیلترها را در چت فعلی متوقف می‌کند. این عمل قابل بازگشت نیست.


  مثال‌ها:

  - تنظیم یک فیلتر:

  -> /filter hello سلام! حالت چطوره؟

  - تنظیم فیلتر چندکلمه‌ای:

  -> /filter hello friend سلام رفیق! خیلی وقته ندیدمت!

  - تنظیم فیلتری که فقط ادمین‌ها بتوانند از آن استفاده کنند:

  -> /filter example این فیلتر اگر کاربر عادی بگوید اجرا نمی‌شود {admin}

  - برای ذخیره فایل، عکس، گیف یا هر پیوست دیگر، کافی است روی فایل ریپلای کنی و بنویسی:

  -> /filter trigger"
formatting_fillings: "<b>جایگزین‌ها</b>


  می‌توانی محتوای پیام را با داده‌های پویا شخصی‌سازی کنی. مثلاً
  در پیام خوش‌آمد نام کاربر را بیاوری یا در یک فیلتر از منشن استفاده کنی.

  از این‌ها در یادداشت‌ها هم می‌توانی استفاده کنی.


  <b>جایگزین‌های پشتیبانی‌شده:</b>

  - <code>{first}</code>: نام کوچک کاربر.

  - <code>{last}</code>: نام خانوادگی کاربر.

  - <code>{fullname}</code>: نام کامل کاربر.

  - <code>{username}</code>: نام کاربری کاربر؛ اگر نداشته باشد، به‌جایش منشن می‌شود.

  - <code>{mention}</code>: کاربر را با نام کوچک منشن می‌کند.

  - <code>{id}</code>: شناسه کاربر.

  - <code>{chatname}</code>: نام چت.

  - <code>{rules}</code>: دکمه قوانین را به پیام اضافه می‌کند.

  - <code>{protect}</code>: از اشتراک‌گذاری محتوا جلوگیری می‌کند.

  - <code>{preview}</code>: پیش‌نمایش لینک در پیام را فعال می‌کند.

  - <code>{nonotif}</code>: اعلان این پیام را غیرفعال می‌کند."
formatting_help_msg: "Jarvis از گزینه‌های قالب‌بندی زیادی پشتیبانی می‌کند تا پیام‌هایت حرفه‌ای‌تر شوند. با دکمه‌های زیر ببین!"
formatting_markdown: |
  <b>قالب‌بندی Markdown</b>

  می‌توانی پیام را با <b>bold</b>، <i>italics</i>، <u>underline</u>
  و گزینه‌های بیشتر قالب‌بندی کنی. امتحانش کن!

  <b>Markdownهای پشتیبانی‌شده</b>:

  - <code>`code words`</code>: از بک‌تیک برای فونت تک‌عرض استفاده می‌شود. نمایش: <code>code words</code>.

  - <code>_italic words_</code>: از آندرلاین برای نوشتار مورب استفاده می‌شود. نمایش: <i>italic words</i>.

  - <code>*bold words*</code>: از ستاره برای نوشتار ضخیم استفاده می‌شود. نمایش: <b>bold words</b>.

  - <code>~strikethrough~</code>: از تیلدا برای خط‌خورده استفاده می‌شود. نمایش: <strike>strikethrough</strike>.

  - <code>||spoiler||</code>: از دو خط عمودی برای متن اسپویلر استفاده می‌شود. نمایش: <tg-spoiler>Spoiler</tg-spoiler>.

  - <code>```pre```</code>: برای اینکه قالب‌بندی‌کننده کاراکترهای دیگر را نادیده بگیرد، متن را داخل '```' بگذار؛ نتیجه مثل این می‌شود: <code>**bold** | *bold*</code>.

  - <code>__underline__</code>: از دو آندرلاین برای زیرخط استفاده می‌شود. نمایش: underline. نکته: بعضی کلاینت‌ها آن را مورب تفسیر می‌کنند؛ در این حالت از قالب‌بندی داخلی برنامه‌ات استفاده کن.

  - <code>[hyperlink](example.com)</code>: این قالب برای لینک استفاده می‌شود. نمایش: <a href='https://example.com/'>hyperlink</a>.

  - <code>[My Button](buttonurl://example.com)</code>: این قالب برای ساخت دکمه است. این مثال دکمه‌ای با نام "My button" می‌سازد که با کلیک، <code>example.com</code> را باز می‌کند.

  اگر می‌خواهی دکمه‌ها در یک ردیف باشند، از قالب <code>:same</code> استفاده کن.

  <b>مثال:</b>

  <code>[button 1](buttonurl:example.com)</code>

  <code>[button 2](buttonurl://example.com:same)</code>

  <code>[button 3](buttonurl://example.com)</code>

  در این حالت دکمه 1 و 2 در یک خط می‌آیند و 3 در خط بعدی قرار می‌گیرد.
formatting_random: |
  <b>محتوای تصادفی</b>

  یکی از قابلیت‌های جذاب این است که محتوای پیام را تصادفی کنی.
  با تغییر پیام خوش‌آمد یا یادداشت‌ها، فضا را شخصی‌تر کن!

  روش استفاده از محتوای تصادفی:

  - %%%: از این جداکننده برای افزودن پاسخ‌های تصادفی استفاده می‌شود.

  مثال:

  <code>سلام

  %%%

  حالت چطوره</code>

  ربات به‌صورت تصادفی یکی از دو پیام "سلام" یا "حالت چطوره" را می‌فرستد.

  از این روش برای شخصی‌سازی بیشتر Jarvis استفاده کن! (فقط در filters/notes کار می‌کند)

  مثال پیام خوش‌آمد:

  - هر بار کاربر جدیدی وارد شود، یکی از این سه پیام را دریافت می‌کند.

  -> /filter "hey"

  سلام <code>{first}</code>!

  %%%

  اوه، <code>{first}</code> حالت چطوره؟

  %%%

  چه خبر <code>{first}</code>
greetings_help_msg:
  "به اعضای جدید گروه خوش‌آمد بگو یا بعد از خروجشان خداحافظی کن!


  *دستورات ادمین:*

  × /setwelcome `<reply/text>`: متن خوش‌آمدگویی گروه را تنظیم می‌کند.

  × /welcome `<yes/no/on/off>`: خوش‌آمدگویی گروه را فعال/غیرفعال می‌کند.

  × /resetwelcome: پیام خوش‌آمدگویی را به حالت پیش‌فرض برمی‌گرداند.

  × /setgoodbye `<reply/text>`: متن خداحافظی گروه را تنظیم می‌کند.

  × /goodbye `<yes/no/on/off>`: خداحافظی گروه را فعال/غیرفعال می‌کند.

  × /resetgoodbye: پیام خداحافظی را به حالت پیش‌فرض برمی‌گرداند.

  × /cleanservice `<yes/no/on/off>`: پیام‌های سیستمی مثل اعلان 'x به گروه پیوست' را حذف می‌کند.

  × /cleanwelcome `<yes/no/on/off>`: با ورود عضو جدید، پیام خوش‌آمد قبلی را حذف می‌کند.

  × /autoapprove `<yes/no/on/off>`: اعضای جدید را خودکار تایید می‌کند."
help_about: "@%s یکی از سریع‌ترین و کامل‌ترین مدیرهای گروه است.


  Jarvis ✨ توسط @DivideProjects توسعه داده می‌شود و به‌صورت فعال نگهداری می‌شود!


  Jarvis از سال 2020 آنلاین بوده و به هزاران گروه با صدها هزار کاربر خدمت داده است!


  <b>چرا Jarvis:</b>

  - ساده: استفاده راحت و سازگار با خیلی از دستورات ربات.

  - کامل: قابلیت‌های زیادی دارد که خیلی از ربات‌های مدیریت گروه ندارند.

  - سریع: حدس بزن چی؟ با Python ساخته نشده؛ زبان اصلی ما <a href='https://go.dev/'>Go</a> است.


  <b>نسخه فعلی:</b> %s"
help_configuration_step-1: "به پیکربندی Jarvis خوش آمدی


  اولین قدم این است که Jarvis ✨ را به گروهت اضافه کنی! برای این کار روی
  دکمه زیر بزن و گروهت را انتخاب کن، سپس برای ادامه آموزش روی «انجام شد» بزن."
help_configuration_step-2: "خیلی خوب، آفرین!


  حالا برای اینکه درست کار کنم باید من را ادمین گروه کنی!

  برای این کار این مراحل ساده را انجام بده:

  ▫️ وارد گروهت شو

  ▫️ روی نام گروه بزن

  ▫️ گزینه ویرایش را بزن

  ▫️ وارد بخش ادمین‌ها شو

  ▫️ افزودن ادمین را بزن

  ▫️ روی آیکون جستجو بزن

  ▫️ @%s را جستجو کن

  ▫️ تایید کن"
help_configuration_step-3: "عالی!


  حالا ربات آماده استفاده است!

  همه دستورات با / یا ! قابل استفاده هستند.


  اگر برای راه‌اندازی من در گروه مشکلی داشتی، بدون تردید به @DivideSupport بیا.

  با خوشحالی کمکت می‌کنیم."
help_donatetext: "پس می‌خواهی حمایت مالی کنی؟ فوق‌العاده است!

  وقتی حمایت می‌کنی، همه مبلغ صرف توسعه من می‌شود تا سریع‌تر و پاسخ‌گوتر شوم.

  حمایت تو ممکن است باعث اضافه‌شدن یک یا چند قابلیت جدید هم بشود که به‌خاطر محدودیت سرور فعلاً ممکن نبوده‌اند.

  همه مبالغ صرف سرویس‌هایی مثل دیتابیس، ذخیره‌سازی و هاست می‌شود!

  برای حمایت، با صاحبم از اینجا در ارتباط باش: @DivideProjectsBot"
lang_sample: فارسی
language_flag: 🇮🇷
language_name: فارسی
languages_help_msg: "نمی‌توانی زبان ربات را تغییر بدهی؟

  با این ماژول به‌راحتی زبان را عوض کن!


  کافی است /lang را بفرستی و از کیبورد شیشه‌ای، زبان خودت یا گروه را انتخاب کنی.


  برای افزودن زبان‌های بیشتر هم می‌توانی در [Crowdin](https://crowdin.com/project/alita_robot) کمک کنی."
locks_help_msg: "*فقط ادمین‌ها*:

  × /lock `<permission>`: یک دسترسی در چت را قفل می‌کند.

  × /unlock `<permission>`: قفل یک دسترسی در چت را باز می‌کند.

  × /locks: وضعیت دسترسی‌های قفل‌شده را نشان می‌دهد.

  × /locktypes: انواع قفل‌های قابل استفاده را نشان می‌دهد!


  با قفل‌ها می‌توانی کاربران گروه را محدود کنی.

  مثلاً با قفل URL، همه پیام‌های دارای لینک خودکار حذف می‌شوند؛ با قفل استیکر هم همه استیکرها حذف می‌شوند و ...

  قفل bots هم جلوی اضافه‌کردن ربات توسط غیرادمین‌ها را می‌گیرد.


  **مثال:**

  `/lock media`: این دستور همه پیام‌های رسانه‌ای چت را قفل می‌کند."
misc_help_msg:
  "× /info: اطلاعات کاربر را می‌دهد؛ با ریپلای یا با دادن شناسه/نام‌کاربری.

  × /id: شناسه گروه فعلی را می‌دهد. اگر روی پیام ریپلای شود، شناسه همان کاربر را می‌دهد.

  × /ping: پینگ سرور تلگرام!

  × /tr <lang code> <msg/reply to message>: پیام را ترجمه می‌کند.

  × /removebotkeyboard: کیبورد گیرکرده ربات را از چت حذف می‌کند.

  × /stat: تعداد کل پیام‌های چت را نشان می‌دهد."
mutes_help_msg:
  "گاهی بعضی کاربران آزاردهنده می‌شوند و بخواهی جلوی ارسال پیامشان را بگیری.
  این ماژول برای همین ساخته شده و می‌توانی با آن اعضای گروه را بی‌صدا کنی.


  *دستورات بی‌صداکردن:* (فقط ادمین‌ها)

  × /mute <userhandle>: کاربر را بی‌صدا می‌کند (با هندل یا ریپلای)

  × /smute <userhandle>: کاربر را بی‌صدا می‌کند بدون ارسال پیام در گروه و دستور شما را هم حذف می‌کند (با هندل یا ریپلای)

  × /dmute <userhandle>: کاربر را بی‌صدا می‌کند و پیام ریپلای‌شده را حذف می‌کند (با هندل یا ریپلای)

  × /tmute <userhandle> x(m/h/d): کاربر را برای مدت `x` بی‌صدا می‌کند (با هندل یا ریپلای).
  m = دقیقه، h = ساعت، d = روز.

  × /unmute <userhandle>: کاربر را از حالت بی‌صدا خارج می‌کند (با هندل یا ریپلای)"
notes_help_msg: 'اطلاعات را با یادداشت‌ها برای کاربران آینده ذخیره کن!

  یادداشت‌ها برای ذخیره چیزهای مفید عالی هستند؛ شماره تلفن، گیف، عکس بامزه یا هر چیز دیگر!

  *دستورات کاربر:*

  - /get <notename>: یک یادداشت را نمایش می‌دهد.

  - #notename: همان /get است.

  دستورات ادمین:

  - /save <notename> <note text>: یک یادداشت جدید با نام دلخواه ذخیره می‌کند. با ریپلای روی پیام هم همان پیام ذخیره می‌شود؛ حتی برای رسانه!

  - /clear <notename>: یادداشت مربوطه را حذف می‌کند.

  - /notes: همه یادداشت‌های چت فعلی را لیست می‌کند.

  - /saved: همان /notes است.

  - /clearall: همه یادداشت‌های چت را حذف می‌کند. این عمل قابل بازگشت نیست.

  - /privatenotes: تعیین می‌کند یادداشت‌ها در پیام خصوصی ارسال شوند یا نه. در این حالت پیامی با دکمه فرستاده می‌شود تا کاربر با زدن آن یادداشت را در PM بگیرد.'
pins_help_msg:
  "همه دستورات مربوط به پین اینجاست؛ با یک پیام پین‌شده ساده، گروه را همیشه به‌روز نگه‌دار!


  *دستورات کاربر:*

  × /pinned: پیام پین‌شده فعلی را نشان می‌دهد.


  *دستورات ادمین:*

  × /pin: پیامی که روی آن ریپلای کرده‌ای را پین می‌کند. با افزودن 'loud' یا 'notify' برای اعضا اعلان می‌فرستد.

  × /pinned: آخرین پیام پین‌شده چت فعلی را نشان می‌دهد.

  × /permapin <text>: یک پیام سفارشی را با ربات پین می‌کند. این پیام می‌تواند شامل markdown، دکمه و امکانات دیگر باشد.

  × /unpin: پیام پین‌شده فعلی را آن‌پین می‌کند. اگر روی پیام ریپلای شود، همان پیام آن‌پین می‌شود.

  × /unpinall: همه پیام‌های پین‌شده را آن‌پین می‌کند.

  × /antichannelpin <yes/no/on/off>: اجازه ندهد تلگرام پیام‌های کانال لینک‌شده را خودکار پین کند.
  اگر آرگومان ندهی، تنظیم فعلی را نشان می‌دهد.

  × /cleanlinked <yes/no/on/off>: پیام‌های ارسالی کانال لینک‌شده را حذف می‌کند.

  نکته: هنگام استفاده از ضد پین کانال، برای برداشتن پین حتماً از /unpin استفاده کن، نه به‌صورت دستی. وگرنه با ارسال پیام جدید از کانال، پیام قبلی دوباره پین می‌شود."
purges_help_msg: "*فقط ادمین‌ها:*

  - /purge: همه پیام‌ها بین این پیام و پیام ریپلای‌شده را حذف می‌کند.

  - /del: پیامی که روی آن ریپلای کرده‌ای را حذف می‌کند.


  *مثال‌ها*:

  - همه پیام‌ها را از پیام ریپلای‌شده تا الان حذف کن.

  -> `/purge`"
reports_help_msg:
  "همه‌مان مشغولیم و همیشه وقت نظارت 24/7 روی گروه را نداریم.
  اما اگر کسی در گروه اسپم کند چه باید کرد؟


  × /report `<reason>`: روی پیام ریپلای کن تا برای ادمین‌ها گزارش شود.

  - @admin: مثل /report است اما به‌صورت دستور نیست.


  *فقط ادمین‌ها:*

  × /reports `<on/off/yes/no>`: تنظیم گزارش را تغییر می‌دهد یا وضعیت فعلی را نشان می‌دهد.

  - اگر در PM انجام شود، وضعیت خودت را تغییر می‌دهد.

  - اگر در گروه انجام شود، وضعیت همان گروه را تغییر می‌دهد.

  × /reports `block` (فقط با ریپلای): کاربر را از استفاده /report یا @admin منع می‌کند.

  × /reports `unblock` (فقط با ریپلای): کاربر را از حالت منع استفاده /report یا @admin خارج می‌کند.

  × /reports `showblocklist`: همه کاربران بلاک‌شده‌ای که نمی‌توانند /report یا @admin استفاده کنند را نشان می‌دهد.


  برای گزارش کاربر کافی است روی پیامش @admin یا /report بفرستی؛ سپس پیام تایید اطلاع‌رسانی به ادمین‌ها ارسال می‌شود.

  برای گزارش کاربر حتماً باید روی یک پیام ریپلای کنی؛ نمی‌توانی بی‌دلیل با @admin ادمین‌ها را تگ کنی!


  *نکته:* اگر ادمین این موارد را بفرستد، فعال نمی‌شوند."
rules_help_msg:
  "هر چت قوانین خودش را دارد؛ این ماژول کمک می‌کند قوانین واضح‌تر باشند!

  *دستورات کاربر*:

  × /rules: قوانین فعلی چت را نشان می‌دهد.

  *دستورات ادمین*:

  × /setrules `<text>`: قوانین این چت را تنظیم می‌کند.

  × /privaterules `<yes/no/on/off>`: تعیین می‌کند قوانین در پیام خصوصی ارسال شوند یا نه.

  × /resetrules: قوانین چت را به حالت پیش‌فرض برمی‌گرداند

  × /rulesbtn `<custom text>`: متن دکمه قوانین را تنظیم می‌کند.

  × /resetrulesbutton: متن دکمه قوانین را به حالت پیش‌فرض برمی‌گرداند.

  × /resetrulesbtn: همان دستور بالاست."
