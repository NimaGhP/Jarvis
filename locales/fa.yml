# Antispam module strings (no commands - automatic background protection)
antispam_help_msg: |
  ماژول ضداسپم به‌صورت خودکار و پشت‌صحنه از گروه‌های شما در برابر اسپم محافظت می‌کند.

  برخلاف سایر ماژول‌ها، این ماژول بدون نیاز به هیچ دستور کاربری به‌صورت خودکار کار می‌کند.

  <b>نحوه کار:</b>
  محدودسازی نرخ برای هر کاربر در هر چت، به‌صورت خودکار جلوی اسپم را می‌گیرد.
  • <b>محدودیت نرخ:</b> 18 پیام در ثانیه برای هر کاربر در هر چت
  • <b>خودکار:</b> بدون نیاز به پیکربندی و آماده استفاده
  • <b>شفاف:</b> پیام‌های بیش‌ازحد را بی‌صدا حذف می‌کند بدون اینکه کاربران عادی مختل شوند
  • <b>رهگیری per-user:</b> در گروه‌های شلوغ با کاربران واقعی زیاد، خطای مثبت کاذب کاهش می‌یابد

antispam_extended_docs: |
  <b>جزئیات فنی</b>

  <b>الگوریتم محدودسازی نرخ:</b>
  این ماژول از رویکرد پنجره لغزان استفاده می‌کند:
  1. <b>اولین پیام:</b> رهگیری با count = 1 شروع می‌شود
  2. <b>پیام‌های بعدی:</b> شمارنده در همان بازه زمانی افزایش می‌یابد
  3. <b>انقضای پنجره:</b> با پایان بازه زمانی (1 ثانیه) شمارنده ریست می‌شود
  4. <b>عبور از آستانه:</b> پیام‌های بیشتر از 18/ثانیه بی‌صدا حذف می‌شوند

  <b>مدیریت حافظه:</b>
  • پاکسازی خودکار: ورودی‌های منقضی هر 5 دقیقه حذف می‌شوند
  • بدون نشت حافظه: goroutine پس‌زمینه از رشد بی‌نهایت حافظه جلوگیری می‌کند
  • ذخیره‌سازی بهینه: فقط کاربران فعال رهگیری می‌شوند

antispam_notes_docs: |
  <b>محدودیت‌ها</b>
  • <b>بدون دستور کاربری:</b> امکان فعال/غیرفعال‌سازی برای هر چت وجود ندارد
  • <b>آستانه ثابت:</b> 18 پیام/ثانیه به‌صورت ثابت در کد تعریف شده است
  • <b>بدون لاگ در چت:</b> رخدادهای اسپم فقط در سمت سرور لاگ می‌شوند

  از <b>Antispam</b> برای محافظت خودکار پس‌زمینه و از <b>Antiflood</b> برای کنترل فلود قابل تنظیم استفاده کنید.

# Admin module extended documentation
admin_extended_docs: |
  <b>پشتیبانی از ادمین ناشناس</b>

  دستور <code>/anonadmin</code> به مالک گروه اجازه می‌دهد تشخیص ادمین ناشناس را روشن/خاموش کند:
  <code>/anonadmin on</code> - فعال‌سازی بررسی ادمین ناشناس
  <code>/anonadmin off</code> - غیرفعال‌سازی بررسی ادمین ناشناس

  وقتی فعال باشد، ربات برای اقدام‌های مدیریتی از حساب‌های ناشناس تایید می‌گیرد.

  <b>نحوه کار تایید ادمین ناشناس:</b>
  1. ربات تشخیص می‌دهد فرستنده GroupAnonymousBot است
  2. پیام اصلی با TTL بیست‌ثانیه‌ای کش می‌شود
  3. دکمه "تایید ادمین" در چت ارسال می‌شود
  4. با کلیک کاربر، ادمین‌بودن تایید شده و دستور اجرا می‌شود
  5. اگر تایید نشود، دکمه بعد از 20 ثانیه منقضی می‌شود

  <b>دستورات پشتیبانی‌شده:</b>
  ادمین: /promote, /demote, /title
  بن‌ها: /ban, /dban, /sban, /tban, /unban
  بی‌صداها: /mute, /smute, /dmute, /tmute, /unmute
  پین‌ها: /pin, /unpin, /permapin, /unpinall
  پاک‌سازی‌ها: /purge, /del
  اخطارها: /warn, /swarn, /dwarn

admin_notes_docs: |
  <b>نکات امنیتی</b>
  • تمام ورودی‌های قابل‌کنترل توسط کاربر با HTML escape ایمن می‌شوند تا از حملات تزریق جلوگیری شود
  • تغییر دسترسی‌های ادمین با مدیریت خطا و بازیابی خطای panic انجام می‌شود

# Antiflood extended docs
antiflood_notes_docs: |
  <b>رفتار پیش‌فرض</b>
  آنتی‌فلود <b>به‌صورت پیش‌فرض غیرفعال</b> است. باید آن را به‌طور صریح با <code>/setflood &lt;number&gt;</code> فعال کنید.

# Locks module extended documentation
locks_types_docs: |
  <b>قفل‌های دسترسی</b> (16 نوع)
  <code>sticker</code> - مسدود کردن استیکرها
  <code>audio</code> - مسدود کردن فایل‌های صوتی
  <code>voice</code> - مسدود کردن پیام‌های صوتی
  <code>document</code> - مسدود کردن اسناد
  <code>video</code> - مسدود کردن ویدیوها
  <code>videonote</code> - مسدود کردن ویدیو نوت
  <code>contact</code> - مسدود کردن مخاطبین
  <code>photo</code> - مسدود کردن عکس‌ها
  <code>gif</code> - مسدود کردن GIFها
  <code>url</code> - مسدود کردن URLها
  <code>bots</code> - جلوگیری از افزودن ربات
  <code>forward</code> - مسدود کردن فوروارد
  <code>game</code> - مسدود کردن بازی‌ها
  <code>location</code> - مسدود کردن لوکیشن
  <code>rtl</code> - مسدود کردن متن راست‌به‌چپ
  <code>anonchannel</code> - مسدود کردن پیام‌های کانال

  <b>قفل‌های محدودسازی</b> (6 نوع)
  <code>messages</code> - مسدود کردن همه پیام‌ها
  <code>comments</code> - مسدود کردن کامنت‌های غیرعضو
  <code>media</code> - مسدود کردن همه رسانه‌ها
  <code>other</code> - مسدود کردن بازی/استیکر/GIF
  <code>previews</code> - مسدود کردن پیش‌نمایش URL
  <code>all</code> - مسدود کردن همه‌چیز

locks_notes_docs: |
  <b>نکات فنی</b>
  • اعمال قفل‌ها به‌صورت لحظه‌ای انجام می‌شود
  • ادمین‌ها از همه قفل‌ها مستثنی هستند
  • قفل‌ها پس از ری‌استارت ربات باقی می‌مانند
  • کش هنگام به‌روزرسانی نامعتبر می‌شود

# Languages extended docs
languages_extended_docs: |
  <b>نحوه کار</b>
  • <b>چت خصوصی:</b> هر کاربر می‌تواند زبان شخصی خودش را تغییر دهد
  • <b>چت گروهی:</b> فقط ادمین‌ها می‌توانند زبان گروه را تغییر دهند

  ترجیحات زبان برای کارایی بهتر کش می‌شوند و برای کاربران و گروه‌ها جداگانه ذخیره می‌گردند.

# Greetings extended docs
greetings_extended_docs: |
  <b>یکپارچه‌سازی کپچا</b>
  وقتی ماژول کپچا فعال باشد:
  1. اعضای جدید هنگام ورود بی‌صدا می‌شوند
  2. به‌جای خوش‌آمدگویی، چالش کپچا ارسال می‌شود
  3. بعد از تایید، پیام خوش‌آمد ارسال می‌شود
  4. در صورت شکست تایید، اقدام کپچا اعمال می‌شود

# Extended documentation locale keys - Notes module
notes_extended_docs: |
  <b>قابلیت‌ها:</b>
  • <b>پشتیبانی متن و رسانه</b>: ذخیره پیام متنی، عکس، ویدیو، سند و بیشتر
  • <b>دکمه سفارشی</b>: افزودن دکمه‌های شیشه‌ای به یادداشت
  • <b>گزینه‌های قالب‌بندی</b>: کنترل نمایش و رفتار یادداشت
  • <b>یادداشت مخصوص ادمین</b>: محدودکردن بعضی یادداشت‌ها به ادمین‌ها
  • <b>یادداشت خصوصی</b>: ارسال یادداشت به‌صورت DM برای کاربران
  • <b>کنترل پیش‌نمایش لینک</b>: فعال/غیرفعال کردن وب‌پریویو
  • <b>محتوای محافظت‌شده</b>: جلوگیری از فوروارد شدن محتوا

  <b>گزینه‌های قالب‌بندی یادداشت:</b>
  هنگام ذخیره یادداشت می‌توانی از تگ‌های ویژه برای کنترل رفتار آن استفاده کنی:
  • <code>{private}</code> - یادداشت فقط در DM ارسال می‌شود و هرگز در گروه نه
  • <code>{noprivate}</code> - یادداشت فقط در گروه ارسال می‌شود و هرگز در DM نه
  • <code>{admin}</code> - فقط ادمین‌ها می‌توانند یادداشت را ببینند
  • <code>{protect}</code> - محتوا قابل فوروارد نیست
  • <code>{nonotif}</code> - ارسال بدون صدای اعلان
  • <code>{nopreview}</code> - غیرفعال‌کردن پیش‌نمایش لینک

  <b>حالت یادداشت خصوصی:</b>
  وقتی حالت یادداشت خصوصی فعال باشد (<code>/privatenotes on</code>)، همه یادداشت‌ها به‌جای گروه در DM برای کاربر ارسال می‌شوند. این کار چت گروه را تمیز نگه می‌دارد.

  هر یادداشت می‌تواند این رفتار را نادیده بگیرد:
  • <code>{private}</code> - همیشه خصوصی ارسال شود
  • <code>{noprivate}</code> - همیشه در گروه ارسال شود

  <b>نمایش خام یادداشت (بدون قالب‌بندی):</b>
  برای دیدن محتوای خام یادداشت بدون قالب‌بندی (برای ویرایش):
  <code>/get notename noformat</code>

notes_permissions_docs: |
  <b>مجوزهای لازم:</b>
  • ذخیره/حذف یادداشت: مجوز تغییر اطلاعات گروه
  • دیدن یادداشت‌های ادمینی: ادمین بودن
  • حذف همه یادداشت‌ها: فقط مالک چت
  • دریافت یادداشت‌های عادی: همه کاربران

# Extended documentation locale keys - Pins module
pins_extended_docs: |
  <b>قابلیت‌ها:</b>

  <b>ضد پین کانال:</b>
  وقتی فعال باشد، ربات هر پیامی را که کانال لینک‌شده به‌صورت خودکار پین کند، خودکار آن‌پین می‌کند. این قابلیت وقتی مفید است که بخواهی کنترل کامل روی پین‌های گروه داشته باشی.

  <b>مهم:</b> هنگام استفاده از ضد پین کانال، همیشه از دستور <code>/unpin</code> استفاده کن و به‌صورت دستی از تلگرام آن‌پین نکن. آن‌پین دستی باعث می‌شود با ارسال پیام جدید کانال، پیام قبلی دوباره پین شود.

  <b>پاک‌سازی لینک‌شده:</b>
  وقتی فعال باشد، ربات همه پیام‌های ارسالی از کانال لینک‌شده به گروه را خودکار حذف می‌کند. این کار چت گروه را از محتوای کراس‌پست‌شده تمیز نگه می‌دارد.

  <b>Permapin:</b>
  ساخت پیام پین سفارشی با:
  • متن با قالب HTML/Markdown
  • دکمه‌های شیشه‌ای دارای URL
  • پیوست رسانه (عکس، سند، استیکر، صوت، ویدیو، ویس، ویدیو نوت)
  • همه جایگذاری‌های استاندارد پیام ({first}، {chatname} و ...)

  <b>پشتیبانی در حالت اتصال:</b>
  وقتی با <code>/connect</code> به چت وصل باشی، این دستورات کار می‌کنند:
  • <code>/antichannelpin</code>
  • <code>/cleanlinked</code>

pins_notes_docs: |
  <b>نکته‌ها:</b>
  • دستور <code>/unpinall</code> قبل از برداشتن همه پین‌ها، تایید می‌گیرد
  • Permapin از همه انواع رسانه‌ای که تلگرام برای پین پشتیبانی می‌کند، پشتیبانی می‌کند
  • تنظیمات ضد پین کانال و پاک‌سازی لینک‌شده برای هر چت جدا ذخیره می‌شوند و بعد از ری‌استارت باقی می‌مانند

  <b>مجوزهای لازم:</b>
  <b>ربات:</b> باید ادمین با مجوز "Pin Messages" باشد
  <b>کاربر:</b> بیشتر دستورها نیاز به ادمین با مجوز "Pin Messages" دارند

# Extended documentation locale keys - Purges module
purges_extended_docs: |
  <b>حذف بازه با purgefrom/purgeto:</b>
  وقتی به کنترل بیشتری روی بازه حذف نیاز داری:

  1. روی <b>اولین</b> پیام بازه ریپلای کن:
  <code>/purgefrom</code>
  ربات تایید می‌کند که پیام علامت‌گذاری شد (بعد از 30 ثانیه منقضی می‌شود).

  2. روی <b>آخرین</b> پیام بازه ریپلای کن:
  <code>/purgeto</code>
  همه پیام‌های بین این دو نشانگر (شامل خودشان) حذف می‌شوند.

  این روش وقتی مفید است که پیدا کردن نقطه شروع سخت باشد یا بخواهی قبل از حذف، بازه را دقیق تایید کنی.

  <b>محدودیت‌ها:</b>
  • <b>حداکثر پیام در هر purge:</b> 1000 پیام
  • <b>محدودیت سن پیام:</b> پیام‌های قدیمی‌تر از 48 ساعت ممکن است قابل حذف نباشند (محدودیت API تلگرام)
  • <b>مجوز لازم:</b> هم کاربر و هم ربات باید مجوز "Delete Messages" داشته باشند

purges_notes_docs: |
  <b>نکته‌ها:</b>
  • نشانگر <code>/purgefrom</code> اگر با <code>/purgeto</code> ادامه پیدا نکند، بعد از 30 ثانیه منقضی می‌شود
  • حذف بازه‌های بزرگ برای کارایی بهتر با پردازش همزمان انجام می‌شود
  • پیام وضعیت (تعداد پیام حذف‌شده) بعد از 3 ثانیه خودکار حذف می‌شود
  • ربات پیام‌هایی که قبلاً حذف شده‌اند را بدون خطا مدیریت می‌کند

# Extended documentation locale keys - Reports module
reports_extended_docs: |
  <b>نحوه کار:</b>

  <b>گزارش یک پیام:</b>
  1. روی <b>پیام مشکل‌دار</b> ریپلای کن و <code>/report</code> بزن یا <code>@admin</code> منشن کن
  2. ربات برای همه ادمین‌هایی که گزارش را فعال کرده‌اند اعلان می‌فرستد
  3. اعلان شامل دکمه‌های اقدام سریع برای مدیریت است

  <b>دکمه‌های اقدام ادمین:</b>
  • <b>📩 Message</b> - لینک پیام گزارش‌شده
  • <b>👢 Kick</b> - کیک کاربر گزارش‌شده (می‌تواند دوباره برگردد)
  • <b>🚫 Ban</b> - بن دائمی کاربر گزارش‌شده
  • <b>🗑 Delete</b> - حذف پیام گزارش‌شده
  • <b>✅ Resolved</b> - بستن گزارش بدون اقدام

  <b>تنظیم شخصی در برابر تنظیم گروه:</b>
  • <b>در PM:</b> <code>/reports on/off</code> تعیین می‌کند خودت اعلان گزارش بگیری یا نه
  • <b>در گروه:</b> <code>/reports on/off</code> تعیین می‌کند گزارش برای آن گروه فعال باشد یا نه

reports_permissions_docs: |
  <b>چه کسانی می‌توانند گزارش کنند؟</b>
  ✅ کاربران عادی
  ❌ ادمین‌ها (نیازی نیست خودشان را گزارش کنند)
  ❌ کاربران بلاک‌شده
  ❌ کانال‌های ناشناس / حساب‌های سیستمی تلگرام

  <b>چه کسانی قابل گزارش هستند؟</b>
  ✅ کاربران عادی
  ❌ خود ربات
  ❌ ادمین‌ها (در برابر گزارش محافظت می‌شوند)
  ❌ کانال‌های ناشناس / حساب‌های سیستمی تلگرام

# Extended documentation locale keys - Rules module
rules_extended_docs: |
  <b>قابلیت‌ها:</b>

  <b>قوانین خصوصی:</b>
  با فعال‌کردن قوانین خصوصی (<code>/privaterules on</code>)، قوانین به‌جای گروه در PM ارسال می‌شوند. این کار چت گروه را تمیز نگه می‌دارد.

  <b>دکمه سفارشی قوانین:</b>
  متن دکمه سفارشی تنظیم کن (حداکثر 30 کاراکتر):
  <code>/rulesbtn مشاهده قوانین</code>

  بازگشت به حالت پیش‌فرض:
  <code>/resetrulesbtn</code>

  <b>تنظیم قوانین:</b>
  می‌توانی قوانین را مستقیم با متن یا با ریپلای روی یک پیام تنظیم کنی:
  <code>/setrules لطفاً به همه اعضا احترام بگذارید.</code>

  یا روی یک پیام ریپلای کن:
  <code>/setrules</code>

  <b>مجوزهای لازم:</b>
  • دستورات کاربر: برای همه کاربران در دسترس
  • دستورات ادمین: نیاز به مجوز ادمینی در چت دارد

# Extended documentation locale keys - Warns module
warns_extended_docs: |
  <b>تنظیمات پیش‌فرض:</b>
  • <b>حد پیش‌فرض اخطار:</b> 3 اخطار
  • <b>حالت پیش‌فرض اخطار:</b> mute

  <b>حالت‌های اخطار:</b>
  • <code>ban</code> - کاربر را به‌صورت دائمی از چت بن می‌کند
  • <code>kick</code> - کاربر را کیک می‌کند (می‌تواند دوباره برگردد)
  • <code>mute</code> - کاربر را بی‌صدا می‌کند (نمی‌تواند پیام بفرستد)

  <b>اخطار بی‌صدا و حذفی:</b>
  • <code>/swarn</code> - دستور شما را حذف می‌کند و بی‌صدا اخطار می‌دهد
  • <code>/dwarn</code> - پیام کاربر را حذف می‌کند و به او اخطار می‌دهد

warns_permissions_docs: |
  <b>نیازمندی مجوزها:</b>
  • <code>/warn</code>, <code>/dwarn</code>, <code>/swarn</code>: ربات ادمین + کاربر ادمین با مجوز restrict
  • <code>/rmwarn</code>, <code>/unwarn</code>: ربات ادمین + کاربر ادمین
  • <code>/resetwarn</code>, <code>/resetwarns</code>: ربات ادمین + کاربر ادمین
  • <code>/resetallwarns</code>: فقط مالک چت
  • <code>/setwarnmode</code>, <code>/setwarnlimit</code>: ربات ادمین + کاربر ادمین
  • <code>/warnings</code>: ربات ادمین + کاربر ادمین
  • <code>/warns</code>: همه کاربران (قابل غیرفعال‌سازی)

warns_notes_docs: |
  <b>نکته‌ها:</b>
  • وقتی کاربر به حد اخطار برسد، اقدام تنظیم‌شده (ban/kick/mute) خودکار اعمال می‌شود
  • دلیل اخطار ذخیره می‌شود و هنگام بررسی اخطارها نمایش داده می‌شود
  • دستور <code>/warns</code> تنها دستور این ماژول است که ادمین می‌تواند غیرفعالش کند
  • پست‌های ناشناس کانال قابل اخطار نیستند
  • به ادمین‌ها اخطار داده نمی‌شود

# Extended documentation locale keys - Mutes module
mutes_extended_docs: |
  <b>فرمت زمان برای بی‌صدای موقت:</b>
  • <code>m</code> = minutes (e.g., <code>30m</code>)
  • <code>h</code> = hours (e.g., <code>2h</code>)
  • <code>d</code> = days (e.g., <code>1d</code>)

  <b>انواع بی‌صدا:</b>
  • <code>/mute</code> - بی‌صدای معمولی با دلیل اختیاری
  • <code>/smute</code> - بی‌صدای بی‌صدا (پیام دستور شما حذف می‌شود)
  • <code>/dmute</code> - حذف-بی‌صدا (کاربر بی‌صدا می‌شود و پیامش حذف می‌شود)
  • <code>/tmute</code> - بی‌صدای موقت با زمان مشخص

  <b>مجوزهای لازم:</b>
  <b>این دستورات فقط مخصوص ادمین‌هاست.</b> کاربری که اجرا می‌کند باید:
  • در چت ادمین باشد
  • مجوز محدودکردن اعضا داشته باشد

  ربات هم باید ادمین با مجوز محدودکردن اعضا باشد.

# Extended documentation locale keys - Filters module
filters_extended_docs: |
  <b>قابلیت‌های پیشرفته:</b>

  <b>پاسخ تصادفی:</b>
  برای جداکردن چند پاسخ از <code>%%%</code> استفاده کن. یکی از آن‌ها تصادفی انتخاب می‌شود:
  <code>/filter hello سلام!%%%درود!%%%چه خبر؟</code>

  <b>فیلتر رسانه‌ای:</b>
  روی هر رسانه‌ای (عکس، ویدیو، سند، استیکر و ...) ریپلای کن و <code>/filter trigger</code> بزن تا فیلتری بسازی که همان رسانه را ارسال کند.

  <b>حالت Noformat:</b>
  ادمین‌ها می‌توانند با افزودن <code>noformat</code> بعد از تریگر، محتوای خام فیلتر (همراه کدهای قالب‌بندی) را ببینند:
  <code>hello noformat</code>
  این حالت برای دیباگ فیلترها یا دیدن تنظیمات دکمه‌ها مفید است.

  <b>دکمه‌های فیلتر:</b>
  می‌توانی به فیلترها دکمه شیشه‌ای اضافه کنی:
  <code>/filter hello سلام! این لینک‌ها را ببین:
  [Button 1](buttonurl:https://example.com)
  [Button 2](buttonurl:https://example2.com)</code>

filters_technical_docs: |
  <b>نحوه کار فیلترها:</b>
  1. وقتی پیام دریافت می‌شود، ربات با کوئری بهینه و کش‌شده همه فیلترهای چت را می‌خواند
  2. الگوریتم Aho-Corasick کل کلیدواژه‌های فیلتر را به‌صورت کارآمد با متن پیام تطبیق می‌دهد
  3. اولین فیلتر منطبق باعث ارسال پاسخ می‌شود
  4. فیلترها از پاسخ متنی، رسانه‌ای و دکمه‌ای پشتیبانی می‌کنند

  <b>تایید بازنویسی:</b>
  اگر بخواهی فیلتری که از قبل وجود دارد را اضافه کنی، ربات قبل از جایگزینی تایید می‌گیرد. این تایید بعد از 5 دقیقه منقضی می‌شود.

  <b>رفتار کش:</b>
  • لیست فیلترها برای هر چت 15 دقیقه کش می‌شود
  • با افزودن یا حذف فیلتر، کش خودکار نامعتبر می‌شود

filters_limits_docs: |
  <b>محدودیت‌ها:</b>
  • حداکثر 150 فیلتر در هر چت
  • حداکثر 100 کاراکتر برای هر کلیدواژه فیلتر
  • کلیدواژه‌ها با حروف کوچک ذخیره می‌شوند

  <b>مجوزهای لازم:</b>
  • <code>/filter</code>, <code>/addfilter</code>: ادمین با مجوز Change Info
  • <code>/stop</code>, <code>/rmfilter</code>, <code>/removefilter</code>: ادمین با مجوز Change Info
  • <code>/stopall</code>: فقط مالک چت
  • <code>/filters</code>: برای همه کاربران در دسترس

# Extended documentation locale keys - Captcha module
captcha_extended_docs: |
  <b>نحوه کار:</b>
  1. وقتی کپچا فعال باشد، اعضای جدید هنگام ورود خودکار بی‌صدا می‌شوند
  2. یک چالش کپچا برای عضو جدید ارسال می‌شود
  3. کاربر باید پاسخ درست را از بین گزینه‌ها انتخاب کند
  4. اگر موفق شود، از حالت بی‌صدا خارج می‌شود و می‌تواند در گروه فعالیت کند
  5. اگر شکست بخورد یا زمان تمام شود، اقدام تنظیم‌شده اعمال می‌شود (kick، ban یا mute)

  <b>انواع کپچا:</b>
  • <b>Math</b>: حل مسائل ساده ریاضی (جمع، تفریق، ضرب)
  • <b>Text</b>: تشخیص متن داخل تصویر مخدوش

  <b>قابلیت پیام‌های معلق:</b>
  وقتی کاربر در حال گذراندن کپچاست، پیام‌هایی که می‌خواهد بفرستد ذخیره و حذف می‌شوند. ادمین‌ها می‌توانند:
  • با <code>/captchapending</code> ببینند کاربر چه پیام‌هایی سعی کرده ارسال کند
  • با <code>/captchaclear</code> پیام‌های ذخیره‌شده را پاک کنند

  این کار کمک می‌کند قبل از تکمیل تایید، تلاش‌های احتمالی اسپم شناسایی شود.

captcha_permissions_docs: |
  <b>نیازمندی‌های ربات:</b>
  • مجوز بن کاربر (برای اقدامات kick/ban)
  • مجوز محدودکردن اعضا (برای بی‌صداکردن حین تایید)
  • مجوز حذف پیام (برای پاکسازی پیام‌های کپچا)

  <b>اقدام در صورت شکست:</b>
  • <code>kick</code> - بن و بلافاصله آن‌بن (کاربر می‌تواند دوباره وارد شود)
  • <code>ban</code> - بن دائمی کاربر
  • <code>mute</code> - نگه‌داشتن کاربر در حالت بی‌صدا برای 24 ساعت

# Extended documentation locale keys - Blacklists module
blacklists_extended_docs: |
  <b>اقدام‌های قابل انتخاب:</b>
  اقدام‌های زیر با <code>/blaction</code> قابل تنظیم هستند:
  • <code>none</code> - فقط پیام را حذف می‌کند و اقدام دیگری انجام نمی‌دهد
  • <code>warn</code> - پیام را حذف می‌کند و به کاربر اخطار می‌دهد (پیش‌فرض)
  • <code>mute</code> - پیام را حذف می‌کند و کاربر را بی‌صدا می‌کند
  • <code>kick</code> - پیام را حذف می‌کند و کاربر را کیک می‌کند (می‌تواند برگردد)
  • <code>ban</code> - پیام را حذف می‌کند و کاربر را دائمی بن می‌کند

  <b>نکته:</b>
  حالت پیش‌فرض بلک‌لیست <b>warn</b> است که پیام را حذف کرده و به کاربر اخطار می‌دهد.

  <b>دستورات:</b>
  • <code>/addblacklist &lt;trigger&gt;</code> - واژه را در چت فعلی بلک‌لیست می‌کند
  • <code>/rmblacklist &lt;trigger&gt;</code> - واژه را از لیست بلک‌لیست چت حذف می‌کند
  • <code>/blaction &lt;mute/kick/ban/warn/none&gt;</code> - اقدام ربات هنگام تشخیص واژه بلک‌لیست را تنظیم می‌کند
  • <code>/remallbl</code> - همه واژه‌های بلک‌لیست چت را حذف می‌کند (فقط مالک)

# Extended documentation locale keys - Disabling module
disabling_extended_docs: |
  <b>قابلیت‌های کلیدی:</b>
  • غیرفعال‌کردن دستورهای مشخص ربات برای کاربران غیرادمین
  • ادمین‌ها همیشه می‌توانند از محدودیت دستورهای غیرفعال عبور کنند
  • امکان حذف خودکار پیام دستورهای غیرفعال
  • پشتیبانی از غیرفعال‌کردن چند دستور به‌صورت همزمان

  <b>غیرفعال‌کردن چند دستور:</b>
  <code>/disable adminlist rules info</code>
  دستورهای <code>/adminlist</code>، <code>/rules</code> و <code>/info</code> را همزمان غیرفعال می‌کند.

  <b>تغییر وضعیت حذف دستور:</b>
  <code>/disabledel on</code> - پیام دستورهای غیرفعال از این به بعد حذف می‌شوند.
  <code>/disabledel off</code> - پیام دستورهای غیرفعال دیگر حذف نمی‌شوند.
  <code>/disabledel</code> - تنظیم فعلی حذف را نشان می‌دهد.

disabling_notes_docs: |
  <b>نکته‌های مهم:</b>
  • <b>عبور ادمین:</b> دستورهای غیرفعال فقط روی کاربران غیرادمین اثر دارند. همه ادمین‌ها همچنان می‌توانند هر دستوری را اجرا کنند.
  • <b>پشتیبانی اتصال:</b> دستورهای غیرفعال همچنان از طریق قابلیت <code>/connect</code> برای چت‌های متصل در دسترس هستند.
  • <b>چند دستور همزمان:</b> هر دو دستور <code>/disable</code> و <code>/enable</code> از چند نام دستور در یک پیام پشتیبانی می‌کنند.
  • <b>مدیریت خطا:</b> اگر بعضی دستورها غیرفعال/فعال نشوند، اعلام می‌شود کدام‌ها موفق و کدام‌ها ناموفق بوده‌اند.

  <b>مجوزهای لازم:</b>
  • <code>/disable</code>, <code>/enable</code>, <code>/disabledel</code>: فقط ادمین
  • <code>/disableable</code>, <code>/disabled</code>: همه کاربران (ولی <code>/disabled</code> خودش هم قابل غیرفعال‌سازی است)

