warns_help_msg:
  "با اخطارها اعضا را تحت کنترل نگه‌دار؛ نگذار اوضاع از دست خارج شود!

  اگر دنبال اخطار خودکار هستی، راهنمای ماژول بلک‌لیست را ببین!


  *دستورات ادمین:*

  - /warn <reason>: به یک کاربر اخطار می‌دهد.

  - /dwarn <reason>: با ریپلای به کاربر اخطار می‌دهد و پیامش را حذف می‌کند.

  - /swarn <reason>: بی‌صدا به کاربر اخطار می‌دهد و پیام شما را حذف می‌کند.

  - /warns: اخطارهای یک کاربر را نشان می‌دهد.

  - /rmwarn: آخرین اخطار یک کاربر را حذف می‌کند.

  - /resetwarn: همه اخطارهای یک کاربر را به 0 برمی‌گرداند.

  - /resetallwarns: همه اخطارهای چت را حذف می‌کند. اخطار همه کاربران به 0 می‌رسد.

  - /warnings: تنظیمات اخطار چت را نشان می‌دهد.

  - /setwarnmode <ban/kick/mute>: حالت اخطار چت را تنظیم می‌کند.

  - /setwarnlimit <number>: تعداد اخطار قبل از مجازات کاربر را تنظیم می‌کند.


  *مثال‌ها*

  - به یک کاربر اخطار بده.

  -> `/warn @user به‌خاطر رعایت‌نکردن قوانین`"

