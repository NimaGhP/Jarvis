bans_help_msg:
  "گاهی بعضی کاربران آزاردهنده می‌شوند و می‌خواهی آن‌ها را از چت حذف کنی؛
  این ماژول دقیقاً برای همین ساخته شده است.

  می‌توانی کاربران را بن/کیک کنی و اگر بعداً رفتارشان بهتر شد آن‌بن‌شان کنی.


  *دستورات کاربران:*

  × /kickme: کاربری که دستور را زده کیک می‌شود.


  *دستورات بن* (فقط ادمین):

  × /ban <userhandle>: کاربر را بن می‌کند (با هندل یا ریپلای).

  × /sban <userhandle>: کاربر را بی‌صدا بن می‌کند؛ پیامی در گروه نمی‌فرستد و دستور شما را هم حذف می‌کند (با هندل یا ریپلای).

  × /dban <userhandle>: کاربر را بن می‌کند و پیام ریپلای‌شده را حذف می‌کند (با هندل یا ریپلای).

  × /tban <userhandle> x(m/h/d): کاربر را برای مدت `x` بن می‌کند (با هندل یا ریپلای).
  m = دقیقه، h = ساعت، d = روز.

  × /unban <userhandle>: کاربر را آن‌بن می‌کند (با هندل یا ریپلای).


  *دستورات محدودسازی:* (فقط ادمین)

  × /restrict: یک کیبورد شیشه‌ای برای انتخاب kick/ban/mute نشان می‌دهد.

  × /unrestrict: یک کیبورد شیشه‌ای برای انتخاب unmute/unban نشان می‌دهد."
