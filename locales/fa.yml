connections_stale_connection: "اتصال شما منقضی شده است - دیگر به این چت دسترسی ندارم. لطفاً برای اتصال مجدد به یک چت معتبر از /connect استفاده کنید."
connections_reconnect_need_pm: برای اتصال مجدد به چت باید در پیام خصوصی با من باشید!
connections_reconnect_no_last_chat: چت قبلی برای اتصال مجدد ندارید!
